<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infectious Disease Monitoring Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: #f4f7f8;
      color: #333;
    }
    header {
      background-color: #2a9d8f;
      color: #fff;
      padding: 15px 20px;
      text-align: center;
    }
    main {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px 30px 15px;
    }
    section {
      background-color: #fff;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    canvas {
      max-width: 100%;
      height: 300px;
    }
    label {
      display: inline-block;
      margin-right: 10px;
      font-weight: bold;
    }
    select {
      padding: 5px;
      font-size: 1em;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #2a9d8f;
      color: white;
    }
    footer {
      text-align: center;
      padding: 15px 10px;
      background-color: #e9ecef;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Infectious Disease Monitoring Dashboard</h1>
    <p>Integrating Social Media Insights & Public Health Data</p>
  </header>

  <main>
    <section>
      <h2>1. Select Symptom</h2>
      <label for="symptom">Symptom:</label>
      <select id="symptom">
        <option value="fever">Fever</option>
        <option value="cough">Cough</option>
        <option value="flu">Flu</option>
      </select>
      <button onclick="loadData()">Analyze</button>
      <p id="status"></p>
    </section>

    <section id="trend-section" style="display:none;">
      <h2>2. Trend Over Time</h2>
      <canvas id="trendChart"></canvas>
    </section>

    <section id="sentiment-section" style="display:none;">
      <h2>3. Sentiment Analysis</h2>
      <canvas id="sentimentChart"></canvas>
    </section>

    <section id="table-section" style="display:none;">
      <h2>4. Sample Posts</h2>
      <table>
        <thead>
          <tr><th>Date</th><th>Text</th><th>Location</th></tr>
        </thead>
        <tbody id="posts-table"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Biotech-Driven Digital Surveillance System Prototype © 2024</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const data = {
      fever: [
        { date: '2024-06-01', text: 'High fever and chills', location: 'New York' },
        { date: '2024-06-02', text: 'Fever symptoms spreading', location: 'London' },
        { date: '2024-06-03', text: 'Sick with fever today', location: 'Mumbai' }
      ],
      cough: [
        { date: '2024-06-01', text: 'Dry cough won’t stop', location: 'Paris' },
        { date: '2024-06-02', text: 'Lots of coughing cases', location: 'Berlin' },
        { date: '2024-06-03', text: 'Persistent cough for days', location: 'Toronto' }
      ],
      flu: [
        { date: '2024-06-01', text: 'Flu season starts early', location: 'Sydney' },
        { date: '2024-06-02', text: 'Symptoms: fever, fatigue, cough', location: 'Chicago' },
        { date: '2024-06-03', text: 'Got the flu despite vaccine', location: 'Tokyo' }
      ]
    };

    function loadData() {
      const selected = document.getElementById('symptom').value;
      const posts = data[selected];
      const status = document.getElementById('status');
      const trendSection = document.getElementById('trend-section');
      const sentimentSection = document.getElementById('sentiment-section');
      const tableSection = document.getElementById('table-section');

      // Count by date
      const dateCounts = {};
      posts.forEach(post => {
        dateCounts[post.date] = (dateCounts[post.date] || 0) + 1;
      });

      // Sentiment (fake: hardcoded counts)
      const sentiments = {
        fever: [2, 0, 1],
        cough: [1, 1, 1],
        flu: [1, 1, 1]
      };

      // Update trend chart
      const trendCtx = document.getElementById('trendChart').getContext('2d');
      new Chart(trendCtx, {
        type: 'line',
        data: {
          labels: Object.keys(dateCounts),
          datasets: [{
            label: 'Posts per day',
            data: Object.values(dateCounts),
            borderColor: '#2a9d8f',
            backgroundColor: 'rgba(42,157,143,0.3)',
            fill: true
          }]
        }
      });

      // Update sentiment chart
      const sentimentCtx = document.getElementById('sentimentChart').getContext('2d');
      new Chart(sentimentCtx, {
        type: 'pie',
        data: {
          labels: ['Positive', 'Negative', 'Neutral'],
          datasets: [{
            data: sentiments[selected],
            backgroundColor: ['#27ae60', '#e74c3c', '#95a5a6']
          }]
        }
      });

      // Update table
      const table = document.getElementById('posts-table');
      table.innerHTML = '';
      posts.forEach(p => {
        const row = `<tr><td>${p.date}</td><td>${p.text}</td><td>${p.location}</td></tr>`;
        table.innerHTML += row;
      });

      // Show sections
      trendSection.style.display = 'block';
      sentimentSection.style.display = 'block';
      tableSection.style.display = 'block';
      status.textContent = `Loaded ${posts.length} posts for ${selected}`;
    }
  </script>
</body>
</html>
